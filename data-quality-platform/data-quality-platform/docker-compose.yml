services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dq_platform
      MYSQL_USER: dquser
      MYSQL_PASSWORD: dqpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-u","root","-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/dq_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: dquser
      DB_PASSWORD: dqpass
      JWT_SECRET: local-development-secret-key-change-me-123456789
    ports: ["8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  mysql_data:
