apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dq-platform
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - name: frontend
        image: YOUR_AWS_ACCOUNT.dkr.ecr.YOUR_REGION.amazonaws.com/dq-frontend:latest
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dq-platform
spec:
  type: LoadBalancer
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
