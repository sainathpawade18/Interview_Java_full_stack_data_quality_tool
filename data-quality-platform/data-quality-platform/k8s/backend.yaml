apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dq-platform
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
      - name: backend
        image: YOUR_AWS_ACCOUNT.dkr.ecr.YOUR_REGION.amazonaws.com/dq-backend:latest
        ports: [{containerPort: 8080}]
        env:
        - {name: DB_URL, value: jdbc:mysql://mysql:3306/dq_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
        - {name: DB_USERNAME, value: dquser}
        - {name: DB_PASSWORD, value: dqpass}
        - {name: JWT_SECRET, value: change-me-in-k8s-secret}
        readinessProbe:
          httpGet: {path: /actuator/health/readiness, port: 8080}
          initialDelaySeconds: 20
        livenessProbe:
          httpGet: {path: /actuator/health/liveness, port: 8080}
          initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dq-platform
spec:
  selector: {app: backend}
  ports: [{port: 8080, targetPort: 8080}]
